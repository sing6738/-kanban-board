<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KanFlow — Kanban Board</title>
  <meta name="description" content="A sleek, mobile-friendly Kanban board to manage your tasks across To Do and Done columns." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens (Lunch Expense App Match) ─────────────────────────── */
    :root {
      --bg-base:        #0a0812;   /* deeper background */
      --glass-bg:       rgba(25, 22, 43, 0.45); /* Grab-style transparency */
      --glass-border:   rgba(255, 255, 255, 0.08);
      --glass-shine:    rgba(255, 255, 255, 0.12);
      
      --bg-surface:     var(--glass-bg);
      --bg-raised:      rgba(46, 41, 82, 0.4);
      --bg-border:      var(--glass-border);

      /* Purple accent scale */
      --purple-400:     #c4b5fd;   
      --purple-500:     #8b5cf6;   
      --purple-600:     #7c3aed;   
      --purple-glow:    rgba(139, 92, 246, 0.25);

      /* Semantic colors match */
      --accent:         var(--purple-500);
      --accent-hover:   var(--purple-600);
      --accent-soft:    rgba(139, 92, 246, 0.15);

      --todo-accent:    var(--purple-500);
      --todo-glow:      var(--purple-glow);
      --done-accent:    #2dd4a0;
      --done-glow:      rgba(45, 212, 160, 0.20);

      /* Text scale */
      --text-primary:   #ffffff;   
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted:     rgba(255, 255, 255, 0.45);

      --danger:         #f43f5e;
      --danger-soft:    rgba(244, 63, 94, 0.15);

      /* Misc */
      --radius:         20px; /* smoother iOS-style corners */
      --radius-sm:      12px;
      --shadow:         0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --transition:     0.4s cubic-bezier(0.2, 0.8, 0.2, 1); /* Smoother transition */

      --font-main:      'Sarabun', 'Inter', sans-serif;
    }

    /* ── Reset & Base ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-main);
      background: var(--bg-base);
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- Liquid Background ---------- */
    .liquid-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: var(--bg-base);
      overflow: hidden;
      filter: blur(80px); /* Massive blur for the mesh effect */
    }

    .blob {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      opacity: 0.5;
      animation: move 20s infinite alternate;
    }

    .blob:nth-child(1) {
      background: radial-gradient(circle, #4c1d95 0%, transparent 70%);
      top: -10%; left: -10%;
    }

    .blob:nth-child(2) {
      background: radial-gradient(circle, #1e1b4b 0%, transparent 70%);
      bottom: -10%; right: -10%;
      animation-delay: -5s;
    }

    .blob:nth-child(3) {
      background: radial-gradient(circle, #5b21b6 0%, transparent 70%);
      top: 40%; left: 30%;
      animation-duration: 25s;
      animation-delay: -10s;
    }

    .blob:nth-child(4) {
      background: radial-gradient(circle, #4c1d95 0%, transparent 70%);
      bottom: 20%; left: 10%;
      animation-duration: 30s;
      animation-delay: -15s;
    }

    @keyframes move {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(100px, 100px) scale(1.2); }
    }

    /* ---------- Scrollbar ---------- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-shine); border-radius: 99px; }

    /* ── Layout & Wrapper ────────────────────────────────────────────────── */
    #app {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      padding: 32px 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 28px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--purple-500), #a78bfa);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px var(--purple-glow);
    }

    .logo-text h1 {
      font-size: 1.4rem; font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff 0%, var(--purple-400) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo-text p { font-size: 0.8rem; color: var(--text-muted); }

    .header-stats {
      display: flex; gap: 10px;
    }
    .stat-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 0.8rem;
      backdrop-filter: blur(10px);
    }
    .stat-pill .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .stat-pill.todo .dot { background: var(--purple-400); box-shadow: 0 0 8px var(--purple-400); }
    .stat-pill.done .dot { background: var(--done-accent); box-shadow: 0 0 8px var(--done-accent); }

    /* ── Glass Panel Utility ─────────────────────────────────────────────── */
    .glass-panel {
      background: rgba(25, 22, 43, 0.70);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .glass-panel:hover {
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.25);
    }

    /* ── Add Task Form ───────────────────────────────────────────────────── */
    .add-form-card {
      padding: 24px;
      margin-bottom: 28px;
    }

    .form-title {
      font-size: 0.8rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--purple-400);
      margin-bottom: 16px;
    }

    .form-row {
      display: flex; gap: 16px; flex-wrap: wrap;
    }

    .input-group {
      flex: 1; min-width: 220px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .input-group label {
      font-size: 0.8rem; font-weight: 500; color: var(--text-secondary);
    }
    .input-group input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .input-group input::placeholder { color: var(--text-muted); }
    .input-group input:focus {
      border-color: var(--purple-500);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 15px var(--purple-glow);
    }

    .btn-add {
      align-self: flex-end;
      padding: 12px 28px;
      background: var(--purple-500);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: #fff; font-size: 0.95rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: var(--transition);
      white-space: nowrap;
      min-width: 140px; justify-content: center;
    }
    .btn-add:hover {
      background: var(--purple-600);
      transform: translateY(-2px);
      box-shadow: 0 0 20px var(--purple-glow);
    }
    .btn-add:active { transform: translateY(0); }
    .btn-add:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ── Progress bar ────────────────────────────────────────────────────── */
    .progress-wrapper {
      margin-bottom: 32px;
    }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      height: 8px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, var(--purple-500), var(--done-accent));
      transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      width: 0%;
    }

    /* ── Kanban Board ────────────────────────────────────────────────────── */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    /* ── Column ──────────────────────────────────────────────────────────── */
    .column {
      display: flex; flex-direction: column;
      padding: 20px;
      min-height: 400px;
    }

    .col-header {
      padding-bottom: 16px;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--glass-border);
    }
    .col-stripe {
      width: 4px; height: 24px; border-radius: 4px;
    }
    .col-todo  .col-stripe { background: var(--purple-400); }
    .col-done  .col-stripe { background: var(--done-accent); }

    .col-title { font-weight: 700; font-size: 1.05rem; flex: 1; letter-spacing: -0.01em; }
    .col-count {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 2px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* ── Task List ───────────────────────────────────────────────────────── */
    .task-list {
      flex: 1;
      display: flex; flex-direction: column; gap: 12px;
    }

    .empty-state {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px;
      padding: 40px 16px;
      color: var(--text-muted);
      text-align: center;
    }
    .empty-state .empty-icon { font-size: 2.2rem; opacity: 0.4; }
    .empty-state p { font-size: 0.85rem; }

    /* ── Task Card ───────────────────────────────────────────────────────── */
    .task-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      transition: var(--transition);
      animation: cardIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(15px); filter: blur(5px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .task-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .task-top { display: flex; align-items: flex-start; gap: 10px; }
    .task-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
    }

    .task-name {
      font-weight: 500; font-size: 0.95rem; line-height: 1.4;
      color: var(--text-primary); flex: 1;
    }
    .col-done .task-name {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-subject {
      display: inline-block;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 50px;
      padding: 2px 12px;
      font-size: 0.78rem;
      color: var(--purple-400);
      width: fit-content;
      font-weight: 500;
    }
    .col-done .task-subject {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--glass-border);
      color: var(--text-muted);
    }

    .task-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 4px;
    }

    .btn-action {
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.8rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: var(--transition);
      flex: 1; justify-content: center;
      min-height: 36px;
      color: var(--text-primary);
    }
    .btn-action:hover  { transform: translateY(-1px); }
    .btn-action:active { transform: translateY(0); }

    .btn-move-done {
      background: rgba(45, 212, 160, 0.12);
      color: var(--done-accent);
      border-color: rgba(45, 212, 160, 0.25);
    }
    .btn-move-done:hover {
      background: rgba(45, 212, 160, 0.22);
      box-shadow: 0 0 12px rgba(45, 212, 160, 0.2);
    }
    
    .btn-move-todo {
      background: var(--accent-soft);
      color: var(--purple-400);
      border-color: rgba(139, 92, 246, 0.25);
    }
    .btn-move-todo:hover {
      background: rgba(139, 92, 246, 0.25);
      box-shadow: 0 0 12px var(--purple-glow);
    }

    .btn-delete {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: rgba(244, 63, 94, 0.2);
      flex: none;
    }
    .btn-delete:hover {
      background: rgba(244, 63, 94, 0.25);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.2);
    }

    /* ── Loading Skeletons ───────────────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
      height: 90px;
      border: 1px solid var(--glass-border);
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    /* ── Toast notifications ──────────────────────────────────────────────── */
    #toast-container {
      position: fixed; top: 24px; right: 24px;
      z-index: 9999; display: flex; flex-direction: column; gap: 10px;
    }
    .toast {
      background: rgba(25, 22, 43, 0.90);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      font-size: 0.88rem;
      min-width: 240px;
      box-shadow: var(--shadow);
      animation: slideIn 0.3s ease, fadeOut 0.4s ease 2.6s forwards;
      display: flex; align-items: center; gap: 10px;
    }
    .toast.success { border-left: 3px solid var(--done-accent); }
    .toast.error   { border-left: 3px solid var(--danger); }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; transform: translateX(30px); }
    }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 680px) {
      header { padding: 24px 0 16px; margin-bottom: 16px; }
      .logo-icon { width: 38px; height: 38px; font-size: 16px; }
      .logo-text h1 { font-size: 1.2rem; }
      .header-stats { gap: 6px; }
      .stat-pill { padding: 4px 10px; font-size: 0.75rem; }
      .add-form-card { padding: 16px; margin-bottom: 20px; }
      .form-row { flex-direction: column; gap: 12px; }
      .btn-add { width: 100%; }
      .board { gap: 16px; }
      .column { min-height: auto; }
    }
  </style>
</head>
<body>

<!-- Liquid Mesh Background -->
<div class="liquid-bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<div id="app">
  <!-- Header -->
  <header>
    <div class="logo-group">
      <div class="logo-icon">📋</div>
      <div class="logo-text">
        <h1>KanFlow</h1>
        <p>Task Management Board</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-pill todo"><span class="dot"></span><span id="stat-todo">0 To Do</span></div>
      <div class="stat-pill done"><span class="dot"></span><span id="stat-done">0 Done</span></div>
    </div>
  </header>

  <!-- Add Task Form -->
  <div class="add-form-card glass-panel">
    <p class="form-title">✦ New Task</p>
    <div class="form-row">
      <div class="input-group">
        <label for="input-name">Task Name</label>
        <input id="input-name" type="text" placeholder="e.g. Design homepage wireframe" maxlength="200" />
      </div>
      <div class="input-group">
        <label for="input-subject">Subject / Tag</label>
        <input id="input-subject" type="text" placeholder="e.g. UI/UX" maxlength="200" />
      </div>
      <button class="btn-add" id="btn-add-task">
        <span>+</span> Add Task
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrapper">
    <div class="progress-label">
      <span>Overall Progress</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Board Columns -->
  <div class="board">
    <!-- To Do Column -->
    <div class="column glass-panel col-todo" id="col-todo">
      <div class="col-header">
        <div class="col-stripe"></div>
        <span class="col-title">To Do</span>
        <span class="col-count" id="count-todo">0</span>
      </div>
      <div class="task-list" id="list-todo">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </div>

    <!-- Done Column -->
    <div class="column glass-panel col-done" id="col-done">
      <div class="col-header">
        <div class="col-stripe"></div>
        <span class="col-title">Done</span>
        <span class="col-count" id="count-done">0</span>
      </div>
      <div class="task-list" id="list-done">
        <div class="skeleton"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast Notifications -->
<div id="toast-container"></div>

<script>
  /* ── Config ─────────────────────────────────────────────────────────── */
  const API_BASE = "";

  /* ── State ──────────────────────────────────────────────────────────── */
  let tasks = [];

  /* ── Utils ──────────────────────────────────────────────────────────── */
  function showToast(msg, type) {
    if (!type) type = "success";
    var c = document.getElementById("toast-container");
    var t = document.createElement("div");
    t.className = "toast " + type;
    t.innerHTML = "<span>" + (type === "success" ? "✓" : "✕") + "</span> " + msg;
    c.appendChild(t);
    setTimeout(function() { t.remove(); }, 3100);
  }

  function getSubjectEmoji(subject) {
    var s = (subject || "").toLowerCase();
    if (s.indexOf("design") >= 0 || s.indexOf("ui") >= 0 || s.indexOf("ux") >= 0) return "🎨";
    if (s.indexOf("dev") >= 0 || s.indexOf("code") >= 0 || s.indexOf("programming") >= 0) return "💻";
    if (s.indexOf("test") >= 0 || s.indexOf("qa") >= 0) return "🧪";
    if (s.indexOf("bug") >= 0 || s.indexOf("fix") >= 0) return "🐛";
    if (s.indexOf("meet") >= 0 || s.indexOf("call") >= 0) return "📞";
    if (s.indexOf("doc") >= 0) return "📄";
    if (s.indexOf("review") >= 0) return "👀";
    return "📌";
  }

  function escHtml(str) {
    var d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  /* ── Render ─────────────────────────────────────────────────────────── */
  function render() {
    var todo = tasks.filter(function(t) { return t.status === "todo"; });
    var done = tasks.filter(function(t) { return t.status === "done"; });
    var total = tasks.length;
    var pct   = total > 0 ? Math.round((done.length / total) * 100) : 0;

    document.getElementById("stat-todo").textContent  = todo.length + " To Do";
    document.getElementById("stat-done").textContent  = done.length + " Done";
    document.getElementById("count-todo").textContent = todo.length;
    document.getElementById("count-done").textContent = done.length;
    document.getElementById("progress-fill").style.width = pct + "%";
    document.getElementById("progress-pct").textContent  = pct + "%";

    renderList("list-todo", todo, "todo");
    renderList("list-done", done, "done");
  }

  function renderList(containerId, items, status) {
    var el = document.getElementById(containerId);
    if (items.length === 0) {
      el.innerHTML =
        '<div class="empty-state">' +
          '<span class="empty-icon">' + (status === "todo" ? "🗒️" : "🎉") + '</span>' +
          '<p>' + (status === "todo" ? "No tasks yet. Add one above!" : "No completed tasks yet.") + '</p>' +
        '</div>';
      return;
    }
    el.innerHTML = items.map(function(task) { return buildCard(task); }).join("");
  }

  function buildCard(task) {
    var isDone  = task.status === "done";
    var emoji   = getSubjectEmoji(task.subject);
    var actionBtn = isDone
      ? '<button class="btn-action btn-move-todo" onclick="moveTask(' + task.id + ',\'todo\')">↩ Move to To Do</button>'
      : '<button class="btn-action btn-move-done" onclick="moveTask(' + task.id + ',\'done\')">✓ Mark Done</button>';

    return '<div class="task-card" id="card-' + task.id + '">' +
      '<div class="task-top">' +
        '<div class="task-icon">' + emoji + '</div>' +
        '<span class="task-name">' + escHtml(task.task_name) + '</span>' +
      '</div>' +
      (task.subject ? '<span class="task-subject">' + escHtml(task.subject) + '</span>' : '') +
      '<div class="task-actions">' +
        actionBtn +
        '<button class="btn-action btn-delete" onclick="deleteTask(' + task.id + ')" title="Delete task">🗑</button>' +
      '</div>' +
    '</div>';
  }

  /* ── API Calls ──────────────────────────────────────────────────────── */
  function fetchTasks() {
    fetch(API_BASE + "/tasks")
      .then(function(res) {
        if (!res.ok) throw new Error("Failed to fetch tasks");
        return res.json();
      })
      .then(function(data) {
        tasks = data;
        render();
      })
      .catch(function() {
        document.getElementById("list-todo").innerHTML = "";
        document.getElementById("list-done").innerHTML = "";
        showToast("Could not load tasks. Is the server running?", "error");
      });
  }

  function addTask() {
    var nameEl    = document.getElementById("input-name");
    var subjectEl = document.getElementById("input-subject");
    var btn       = document.getElementById("btn-add-task");

    var task_name = nameEl.value.trim();
    var subject   = subjectEl.value.trim();

    if (!task_name) {
      nameEl.focus();
      nameEl.style.borderColor = "var(--danger)";
      setTimeout(function() { nameEl.style.borderColor = ""; }, 1500);
      return;
    }

    btn.disabled = true;
    btn.textContent = "Adding...";

    fetch(API_BASE + "/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_name: task_name, subject: subject }),
    })
      .then(function(res) {
        if (!res.ok) throw new Error();
        return res.json();
      })
      .then(function(newTask) {
        tasks.push(newTask);
        nameEl.value = "";
        subjectEl.value = "";
        render();
        showToast('"' + task_name + '" added!');
      })
      .catch(function() {
        showToast("Failed to add task.", "error");
      })
      .finally(function() {
        btn.disabled = false;
        btn.textContent = "+ Add Task";
      });
  }

  function moveTask(id, newStatus) {
    var card = document.getElementById("card-" + id);
    if (card) { card.style.opacity = "0.5"; card.style.pointerEvents = "none"; }

    fetch(API_BASE + "/tasks/" + id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: newStatus }),
    })
      .then(function(res) {
        if (!res.ok) throw new Error();
        return res.json();
      })
      .then(function(updated) {
        tasks = tasks.map(function(t) { return t.id === id ? updated : t; });
        render();
        showToast(newStatus === "done" ? "Task completed! 🎉" : "Moved back to To Do.");
      })
      .catch(function() {
        if (card) { card.style.opacity = ""; card.style.pointerEvents = ""; }
        showToast("Failed to update task.", "error");
      });
  }

  function deleteTask(id) {
    var card = document.getElementById("card-" + id);
    if (card) {
      card.style.transition = "opacity 0.2s, transform 0.2s";
      card.style.opacity = "0";
      card.style.transform = "scale(0.9)";
    }

    fetch(API_BASE + "/tasks/" + id, { method: "DELETE" })
      .then(function(res) {
        if (!res.ok) throw new Error();
        tasks = tasks.filter(function(t) { return t.id !== id; });
        render();
        showToast("Task deleted.");
      })
      .catch(function() {
        if (card) { card.style.opacity = ""; card.style.transform = ""; }
        showToast("Failed to delete task.", "error");
      });
  }

  /* ── Event Listeners ────────────────────────────────────────────────── */
  document.getElementById("btn-add-task").addEventListener("click", addTask);

  document.getElementById("input-name").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      var sub = document.getElementById("input-subject");
      if (sub.value.trim() === "") sub.focus();
      else addTask();
    }
  });
  document.getElementById("input-subject").addEventListener("keydown", function(e) {
    if (e.key === "Enter") { e.preventDefault(); addTask(); }
  });

  /* ── Init ───────────────────────────────────────────────────────────── */
  fetchTasks();
</script>
</body>
</html>
